name: Build and Release uYouEnhanced

on:
  workflow_dispatch:
    inputs:
      sdk_version:
        description: "iOS SDK Version"
        default: "17.5"
        required: true
        type: string
      uyou_version:
        description: "uYou Version"
        default: "3.0.4"
        required: true
        type: string
      decrypted_youtube_url:
        description: "Direct URL of the decrypted YouTube IPA"
        default: ""
        required: true
        type: string
      bundle_id:
        description: "Modify the bundle ID"
        default: "com.google.ios.youtube"
        required: true
        type: string
      app_name:
        description: "Modify the app name"
        default: "YouTube"
        required: true
        type: string
      upload_artifact:
        description: "Upload IPA as artifact"
        default: true
        required: false
        type: boolean

jobs:
  build:
    name: Build uYouEnhanced
    runs-on: macos-14
    permissions:
      contents: write

    steps:
      - name: Checkout Main
        uses: actions/checkout@v5
        with:
          path: main
          submodules: recursive

      - name: Install Dependencies
        run: |
          # Hapus yang lama kalau ada (abaikan kalau error)
          brew uninstall --ignore-dependencies dpkg || true
          # Install ldid, make, dan dpkg resmi dari brew
          brew install ldid make dpkg
          # Link-kan dpkg agar bisa dipanggil langsung
          brew link --overwrite dpkg

      - name: Set PATH environment variable
        run: |
          echo "$(brew --prefix make)/libexec/gnubin" >> $GITHUB_PATH
          echo "$(brew --prefix dpkg)/bin" >> $GITHUB_PATH
          echo "$(brew --prefix dpkg)/sbin" >> $GITHUB_PATH

      - name: Setup Theos
        uses: actions/checkout@v5
        with:
          repository: theos/theos
          ref: master
          path: theos
          submodules: recursive
      
      - name: SDK Caching
        id: SDK
        uses: actions/cache@v4
        with:
          path: theos/sdks/
          key: iOS-${{ github.event.inputs.sdk_version }}-SDK

      - name: Download iOS SDK
        if: steps.SDK.outputs.cache-hit != 'true'
        run: |
          # Buat folder tujuan
          mkdir -p ${{ github.workspace }}/theos/sdks
          # Download SDK versi spesifik langsung (format tarball lebih aman)
          curl -LO https://github.com/theos/sdks/archive/master.tar.gz
          tar -xzf master.tar.gz
          # Pindahkan semua isi folder sdks ke tempat yang benar
          mv sdks-master/*.sdk ${{ github.workspace }}/theos/sdks/
          # Bersihkan sampah
          rm -rf sdks-master master.tar.gz

      - name: Setup Theos Jailed
        uses: actions/checkout@v5
        with:
          repository: qnblackcat/theos-jailed
          ref: master
          path: theos-jailed

      - name: Install Theos Jailed
        run: ./theos-jailed/install
        env:
          THEOS: ${{ github.workspace }}/theos

      - name: Prepare YouTube iPA
        id: prepare_youtube
        run: |
          mkdir -p main
          # Tembak langsung ke input tanpa variabel perantara yang rawan kosong
          wget "${{ github.event.inputs.decrypted_youtube_url }}" --quiet --no-verbose -O main/YouTube.ipa
          cd main
          mv YouTube.ipa YouTube.zip
          unzip -q YouTube.zip
          youtube_version=$(defaults read "$(pwd)/Payload/YouTube.app/Info" CFBundleVersion)
          echo "==> YouTube v$youtube_version downloaded!"
          sed -i '' "17s#.*#YOUTUBE_VERSION = ${youtube_version}#g" Makefile
          echo "youtube_version=${youtube_version}" >> $GITHUB_OUTPUT
        env:
          THEOS: ${{ github.workspace }}/theos
          
      - name: Fix compiling & Build Package
        id: build_package
        run: |
          cd main
          sed -i '' "s/BUNDLE_ID = .*/BUNDLE_ID = ${{ github.event.inputs.bundle_id }}/g" Makefile
          sed -i '' "s/DISPLAY_NAME = .*/DISPLAY_NAME = ${{ github.event.inputs.app_name }}/g" Makefile
          sed -i '' "s|export TARGET = .*|export TARGET = iphone:clang:${{ github.event.inputs.sdk_version }}:14.0|g" Makefile
          make package THEOS_PACKAGE_SCHEME=rootless IPA=Payload/YouTube.app FINALPACKAGE=1
          echo "package=$(ls -t packages | head -n1)" >> $GITHUB_OUTPUT
        env:
          THEOS: ${{ github.workspace }}/theos
          UYOU_VERSION: ${{ github.event.inputs.uyou_version }}

      - name: Upload Artifact
        if: ${{ github.event.inputs.upload_artifact == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: uYouEnhanced_${{ steps.prepare_youtube.outputs.youtube_version }}
          path: main/packages/*.ipa
